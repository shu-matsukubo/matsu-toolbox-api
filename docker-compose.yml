services:
  api:
    image: matsu-toolbox-api:local
    build:
      context: .
    container_name: matsu-toolbox-api
    ports:
      - 18083:8080
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://matsu-toolbox:matsu-toolbox-pass@toolbox-db:5432/matsu-toolbox
      - AUTH_ISSUER=http://localhost:18081
      - AUTH_AUDIENCE=matsu-toolbox-api
      - AUTH_JWKS_URL=http://host.docker.internal:18081/.well-known/jwks.json
      - AUTH_JWKS_CACHE_SECONDS=600
      - AUTH_JWKS_TIMEOUT_MILLISECONDS=5000
    depends_on:
      toolbox-db:
        condition: service_healthy

  toolbox-db:
    image: postgres:16-alpine
    container_name: matsu-toolbox-db
    ports:
      - 15433:5432
    environment:
      - POSTGRES_DB=matsu-toolbox
      - POSTGRES_USER=matsu-toolbox
      - POSTGRES_PASSWORD=matsu-toolbox-pass
      - TZ=Asia/Tokyo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matsu-toolbox -d matsu-toolbox']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - toolbox_db_data:/var/lib/postgresql/data

  test:
    profiles: ['test']
    image: matsu-toolbox-api:local
    build:
      context: .
    environment:
      - DATABASE_URL=postgres://matsu-toolbox-test:matsu-toolbox-test-pass@test-db:5432/matsu-toolbox-test
      - TEST_DATABASE_URL=postgres://matsu-toolbox-test:matsu-toolbox-test-pass@test-db:5432/matsu-toolbox-test
    networks:
      - test
    depends_on:
      test-db:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && npm run db:migrate && npm run test:integration']

  test-db:
    profiles: ['test']
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=matsu-toolbox-test
      - POSTGRES_USER=matsu-toolbox-test
      - POSTGRES_PASSWORD=matsu-toolbox-test-pass
      - TZ=Asia/Tokyo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matsu-toolbox-test -d matsu-toolbox-test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test

networks:
  test:
    internal: true

volumes:
  toolbox_db_data:
